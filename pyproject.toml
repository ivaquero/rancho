[project]
name = "rancho"
version = "0.1.0"
description = "农田作物仿真台"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ivaquero", email = "msaintms@outlook.com" }]
dependencies = [
  "cropforge>=1.0.1",
  "fastapi>=0.159.1",
  "mesa>=3.5.1",
  "networkx>=3.7",
  "numpy>=2.5.4",
  "pandas>=3.0.6",
  "pyarrow>=26.0.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rancho = "rancho.cli:main"

# ----------------------------------------------------------- dev tools ----
[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["ignore:starlette.middleware.wsgi is deprecated"]
pythonpath = ["tests"]
testpaths = ["tests"]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["."]
extend-exclude = ["frontend", "runs", ".rancho", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rancho"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ------------------------------------------------------------------ ty ----
[tool.ty.src]
include = ["rancho", "tests"]

[tool.ty.rules]
unresolved-attribute = "warn"

[tool.uv.build-backend]
module-root = ""
