[project]
name = "rancho"
version = "0.1.0"
description = "农田作物仿真台"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ivaquero", email = "msaintms@outlook.com" }]
dependencies = [
  "cropforge>=1.0.1",
  "fastapi>=0.159.1",
  "mesa>=3.5.1",
  "networkx>=3.7",
  "numpy>=2.5.4",
  "pandas>=3.0.6",
  "pyarrow>=26.0.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rancho = "rancho.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# ----------------------------------------------------------- dev tools ----
[dependency-groups]
dev = ["pytest>=9.1.1"]

# -------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
filterwarnings = [
    # Same reason as the guard in ``rancho/cli.py``: importing ``cropforge``
    # pulls in ``fastapi.middleware.wsgi`` for its Dash panel, and starlette has
    # deprecated that module.  Nothing here uses it and the fix is not ours.
    "ignore:starlette.middleware.wsgi is deprecated",
]

# ---------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
# Markdown is excluded on purpose: ``ruff format`` rewrites the Python inside
# code fences, which collapses the column-aligned trailing comments the docs use
# to annotate field tables.  The docs are prose, not a build target.
extend-exclude = ["frontend", "runs", ".rancho", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rancho"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ------------------------------------------------------------------ ty ----
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# CropForge exposes dynamic, dataclass-heavy state objects that resolve to Any.
unresolved-attribute = "warn"
