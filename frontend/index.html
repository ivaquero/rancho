<!doctype html>
<!--
  This file carries no copy of its own: every user-visible string is a
  `data-i18n` key, and the Vite plugin (see vite.config.ts) bakes in
  DEFAULT_LANG before the bundle runs.  Markup therefore never has to change
  when copy is edited or a language is added.
-->
<html lang="{{htmlLang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title data-i18n="app.title"></title>
    <script>
      // The baked-in copy belongs to DEFAULT_LANG. When the stored language
      // differs, hide it until the bundle paints the right one — otherwise
      // switching to English and reloading flashes the wrong language.
      // Without JS the baked-in copy simply stays visible.
      (function () {
        var baked = "{{defaultLang}}";
        var tags = {{langMap}};
        var saved = null;
        try {
          saved = localStorage.getItem("rancho.lang");
        } catch (e) {
          saved = null;
        }
        if (!saved || !tags[saved]) return;
        document.documentElement.lang = tags[saved];
        if (saved === baked) return;
        var style = document.createElement("style");
        style.id = "i18n-pending";
        style.textContent = "[data-i18n]{visibility:hidden}";
        document.head.appendChild(style);
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <header class="bar bar--top">
        <div class="brand">
          <span class="brand__mark">RANCHO</span>
          <span class="brand__sub" data-i18n="brand.sub"></span>
        </div>
        <div class="controls">
          <label class="field">
            <span data-i18n="field.scenario"></span>
            <select id="preset"></select>
          </label>
          <button id="run" class="btn btn--primary" type="button" data-i18n="btn.run"></button>
          <label class="field field--tight">
            <span data-i18n="lang.label"></span>
            <select id="lang"></select>
          </label>
          <span id="status" class="status" data-i18n="status.connecting"></span>
        </div>
      </header>

      <aside class="panel panel--right">
        <section class="block">
          <h2 data-i18n="title.channels"></h2>
          <div id="channels" class="chips"></div>
        </section>

        <section class="block">
          <h2 data-i18n="title.legend"></h2>
          <div class="legend">
            <div id="legend-bar" class="legend__bar"></div>
            <div id="legend-crops" class="legend__crops" hidden></div>
            <div class="legend__scale">
              <span id="legend-low">0</span>
              <span id="legend-unit"></span>
              <span id="legend-high">1</span>
            </div>
          </div>
        </section>

        <section class="block">
          <h2 data-i18n="title.metrics"></h2>
          <dl id="metrics" class="metrics"></dl>
        </section>

        <section class="block">
          <h2 data-i18n="title.layout"></h2>
          <div id="palette" class="chips palette"></div>
          <div class="stack">
            <label class="toggle">
              <input id="paint-mode" type="checkbox" checked />
              <span data-i18n="layout.toggle"></span>
            </label>
            <div class="stack__row">
              <button id="fill-all" class="btn btn--tiny" type="button" data-i18n="btn.fillAll"></button>
              <button id="fill-bands" class="btn btn--tiny" type="button" data-i18n="btn.fillBands"></button>
              <button id="reset-crops" class="btn btn--tiny" type="button" data-i18n="btn.reset"></button>
            </div>
            <p class="hint" id="layout-hint" data-i18n="layout.enabledHint"></p>
          </div>
          <dl id="crop-mix" class="metrics metrics--dim"></dl>
        </section>

        <section class="block">
          <h2 data-i18n="title.size"></h2>
          <div class="stack">
            <label class="slider">
              <span class="slider__label" data-i18n="slider.rows"></span>
              <input id="rows" type="range" min="4" max="72" step="1" value="18" />
              <output id="rows-out">18</output>
            </label>
            <label class="slider">
              <span class="slider__label" data-i18n="slider.cols"></span>
              <input id="cols" type="range" min="4" max="96" step="1" value="40" />
              <output id="cols-out">40</output>
            </label>
            <label class="slider">
              <span class="slider__label" data-i18n="slider.days"></span>
              <input id="days" type="range" min="10" max="240" step="5" value="130" />
              <output id="days-out">130</output>
            </label>
            <!-- Both hints are numbers plus localised units, so JS owns them. -->
            <p class="hint" id="days-hint"></p>
            <p class="hint" id="grid-hint"></p>
          </div>
        </section>

        <section class="block">
          <h2 data-i18n="title.field"></h2>
          <dl id="field-info" class="metrics metrics--dim"></dl>
        </section>

        <section class="block">
          <h2 data-i18n="title.yield"></h2>
          <dl id="yield-info" class="metrics metrics--dim"></dl>
        </section>
      </aside>

      <section class="panel panel--chart">
        <div class="panel__head">
          <h2 data-i18n="title.trajectory"></h2>
          <span class="panel__hint" data-i18n="chart.hint"></span>
        </div>
        <div id="chart" class="chart"></div>
      </section>

      <footer class="bar bar--bottom">
        <!-- Icon-only button: the glyph is language-free, so its name is the
             aria label, rewritten by setPlayButton() as play/pause flips. -->
        <button id="play" class="btn btn--ghost" type="button" data-i18n-aria="btn.play">▶</button>
        <div class="timeline">
          <input id="day" type="range" min="0" max="1" value="0" step="1" />
          <div class="timeline__labels">
            <span id="day-label" data-i18n="day.initial"></span>
            <span id="date-label" data-i18n="na"></span>
          </div>
        </div>
        <label class="field field--tight">
          <span data-i18n="speed.label"></span>
          <select id="speed">
            <option value="200" data-i18n="speed.slow"></option>
            <option value="90" selected data-i18n="speed.normal"></option>
            <option value="35" data-i18n="speed.fast"></option>
          </select>
        </label>
        <label class="field field--tight">
          <span data-i18n="field.exaggerate"></span>
          <input id="exaggerate" type="range" min="1" max="3" step="0.1" value="1.8" />
        </label>
      </footer>

      <div id="tooltip" class="tooltip" hidden></div>
      <div id="overlay" class="overlay">
        <div class="overlay__box">
          <p id="overlay-text" data-i18n="overlay.connecting"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
