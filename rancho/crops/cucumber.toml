# 黄瓜 · 大棚吊蔓（Rancho 模板 v1）
#
# 更短的物候、更快张开的冠层、更浅的根区：黄瓜是三种作物里的量产者，
# 也是争电时最先被挤掉的那个。字段含义见 docs/crops.md。

id = "cucumber"
label = "黄瓜"
label_en = "Cucumber"
label_es = "Pepino"
species = "Cucumis sativus"
base_temp_c = 12.0                  # 黄瓜喜温，基温比番茄高 2 °C

[[stages]]
name = "germination"
gdd = 0.0

[[stages]]
name = "emergence"
gdd = 50.0

[[stages]]
name = "seedling"
gdd = 100.0

[[stages]]
name = "vegetative"
gdd = 220.0

[[stages]]
name = "flowering"
gdd = 330.0

[[stages]]
name = "fruit_set"
gdd = 380.0

[[stages]]
name = "fruiting"
gdd = 430.0

[[stages]]
name = "maturity"
gdd = 900.0                         # 全季 900 °C·d，约为番茄的一半

[growth]
rue = 1.45
lai_slope = 0.0070                  # 冠层张得比番茄快
lai_max = 3.8
senescence_rate = 0.015
senescence_stages = ["maturity"]
transplant_lai = 0.55

[structure]
k_height = 9.0
max_height_cm = 250.0               # 吊蔓到 2.5 m

[season]
days_to_maturity = 100              # 比番茄短：全季积温约番茄一半

[water]
root_zone_mm = 350.0                # 根系比番茄浅
kc_mid = 1.05
depletion_fraction = 0.45
k_extinction = 0.70
n_concentration = 0.030
splits = [0.03, 0.20, 0.40, 0.60]   # 四次追肥

[product]
dry_matter_fraction = 0.045
marketable_fraction = 0.95
harvest_index = 0.55                # 连续采收：茎叶留存比例高于番茄

[market]
price_yuan_kg = 9.0
dli_target = 18.0
light_w_m2 = 110.0
setpoint_day_c = 26.0
setpoint_night_c = 17.0
t_opt_c = 24.0
t_min_c = 12.0
t_max_c = 34.0
t_critical_c = 35.0
damage_per_hour_k = 0.018
growth_max_g_m2_day = 100.0
dli_half = 10.0
fert_g_m2_day = 0.32
