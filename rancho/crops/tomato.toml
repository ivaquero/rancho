# 番茄 · 大棚栽培（Rancho 模板 v1）
#
# 改这个文件就是改作物本身：生长插件、根区水氮、产品折算三处参数都从这里读，
# 不必再去改 Python。保存后重启进程生效（模板在 import 时加载并校验）。
# 字段含义与单位见 docs/crops.md；校验规则见 rancho/crops/__init__.py。

id = "tomato"                       # 必须等于文件名，也是 scenario.crop 的取值
label = "番茄"                       # 界面、报告、账本上的显示名
label_en = "Tomato"
label_es = "Tomate"
species = "Solanum lycopersicum"
base_temp_c = 10.0                  # 热时间基温 °C，低于此温度不计积温

# 物候阈值：gdd 是进入该阶段所需的累计有效积温（°C·d），从播种起算。
# 必须从 0.0 开始、严格递增；名称取自 scenario.STAGE_ORDER。
# 番茄的「成熟」定在 1900：果期长，拉到拔秧为止。
[[stages]]
name = "germination"
gdd = 0.0

[[stages]]
name = "emergence"
gdd = 55.0

[[stages]]
name = "seedling"
gdd = 110.0

[[stages]]
name = "vegetative"
gdd = 300.0

[[stages]]
name = "flowering"
gdd = 500.0

[[stages]]
name = "fruit_set"
gdd = 600.0

[[stages]]
name = "fruiting"
gdd = 700.0

[[stages]]
name = "maturity"
gdd = 1900.0

[growth]
rue = 1.55                          # 辐射利用效率：每 MJ 截获辐射的干物质克数
lai_slope = 0.0045                  # 冠层张开期每 °C·d 增加的 LAI
lai_max = 3.4                       # 封行后的叶面积上限
senescence_rate = 0.012             # 进入衰老阶段后每日 LAI 损失比例
senescence_stages = ["maturity"]    # 结果期仍更新冠层，成熟才衰老
transplant_lai = 0.45               # 定植苗的起始 LAI（温室是定植不是播种）

[structure]
k_height = 8.0                      # 株高异速：cm per √g 干物质
max_height_cm = 220.0               # 吊蔓钢丝高度，冠层到此封顶

[season]
days_to_maturity = 130              # 定植到拔秧：一茬大棚番茄约四个半月

[water]
root_zone_mm = 450.0                # 有效根区贮水量（滴灌番茄取 45 cm 土深）
kc_mid = 1.15                       # FAO-56 生育中期作物系数
depletion_fraction = 0.40           # FAO-56 允许消耗比例 p
k_extinction = 0.65                 # Beer-Lambert 消光系数，用于冠层配光
n_concentration = 0.032             # 植株组织含氮率，用于带走量
splits = [0.03, 0.18, 0.34, 0.50, 0.66, 0.80]   # 六次追肥所在的季内累积时点

[product]
dry_matter_fraction = 0.055         # 鲜果干物质率，干重折鲜重用
marketable_fraction = 0.92          # 商品率，扣除裂果与次品
harvest_index = 0.32                # 地上干物质进入果实的比例（果菜偏低）

# 以下只有经济层（rancho.econ）读：报价、光照响应与温度耐受。
[market]
price_yuan_kg = 14.0                # 售价，元/kg
dli_target = 20.0                    # 目标日累积光积分，mol/m²/日
light_w_m2 = 130.0                   # 补光灯安装密度下的照度，W/m²
setpoint_day_c = 26.0                # 白天温控设定点
setpoint_night_c = 18.0              # 夜间温控设定点
t_opt_c = 22.0                       # 最适温度
t_min_c = 9.0                        # 生长下限
t_max_c = 32.0                       # 生长上限
t_critical_c = 34.0                  # 超过即开始累计品质损伤
damage_per_hour_k = 0.020            # 每超 1 K 每小时的品质损伤
growth_max_g_m2_day = 85.0           # 潜在可售鲜重，g/m²/日（饱和光响应）
dli_half = 11.0                      # 半饱和 DLI
fert_g_m2_day = 0.35                 # 每日施肥需求，g/m²
